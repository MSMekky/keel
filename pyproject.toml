[project]
name = "keel"
version = "0.1.0"
description = "A governed execution layer for internal LLM agents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.ruff]
line-length = 88
target-version = "py311"
